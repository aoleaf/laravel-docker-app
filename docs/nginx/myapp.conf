server {
    server_name aoleaf.com;

    location / {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aoleaf.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aoleaf.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.aoleaf.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aoleaf.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name aoleaf.com www.aoleaf.com;
    return 404; # managed by Certbot




}
server {
    listen 443 ssl;
    server_name www.aoleaf.com;

    ssl_certificate /etc/letsencrypt/live/aoleaf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aoleaf.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://aoleaf.com$request_uri;
}